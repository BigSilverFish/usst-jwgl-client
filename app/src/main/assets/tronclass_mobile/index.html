    .worm .load {

      background-color: rgba(255, 255, 255, 0.7);

    .worm .load .line:nth-last-child(1) {
      -webkit-animation: loading 0.6s 0.1s linear infinite;
      animation: loading 0.6s 0.1s linear infinite;
    }

      -webkit-animation: loading 0.6s 0.2s linear infinite;
      animation: loading 0.6s 0.2s linear infinite;
    }

      -webkit-animation: loading 0.6s 0.3s linear infinite;
      animation: loading 0.6s 0.3s linear infinite;
    }

      -webkit-animation: loading 0.6s 0.4s linear infinite;
      animation: loading 0.6s 0.4s linear infinite;
    }

      -webkit-animation: loading 0.6s 0.5s linear infinite;
      animation: loading 0.6s 0.5s linear infinite;
    }

    @-webkit-keyframes loading {
      0% {
        -webkit-transform: translate(0, 0);

      }

        -webkit-transform: translate(0, 15px);
        transform: translate(0, 15px);
      }

      100% {
        -webkit-transform: translate(0, 0);
        transform: translate(0, 0);
